openapi: 3.0.3
info:
  title: SROOM Catalog API
  version: 1.6.0
  description: |
    The local gateway forwards the same Catalog API. An incoming X-Request-ID
    with 1-64 ASCII letters, digits, underscores, or hyphens is preserved.
    Catalog generates a request ID when the header is absent or invalid.
servers:
  - url: http://localhost:8082
paths:
  /api/v1/catalog/admin/images:
    post:
      operationId: uploadImage
      summary: Upload a catalog image
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: One JPEG, PNG, or WebP file up to 5 MiB. Total request limit is 6 MiB.
      responses:
        '201':
          description: Image uploaded. Use the returned key to attach it to a brand, banner, or car.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [object_key]
                    properties:
                      object_key: { type: string }
        default:
          $ref: '#/components/responses/Error'
  /api/v1/catalog/admin/brands:
    get:
      operationId: listBrands
      summary: List brands ordered by name, then ID
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Case-insensitive literal substring of the brand name.
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Page of active and inactive brands, including brands without cars.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Brand'
                  page:
                    type: object
                    required: [number, limit, total]
                    properties:
                      number: { type: integer }
                      limit: { type: integer }
                      total: { type: integer, format: int64 }
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createBrand
      summary: Create a brand
      description: New brands start as active.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBrandInput'
      responses:
        '201':
          $ref: '#/components/responses/Brand'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/catalog/admin/brands/{id}:
    patch:
      operationId: updateBrand
      summary: Update a brand
      description: Omitted fields keep their values. When image_object_key is sent, it also replaces the associated filename. Send image_object_key as null to detach the image and clear its filename. Use status inactive to deactivate a brand.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBrandInput'
      responses:
        '200':
          $ref: '#/components/responses/Brand'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/catalog/admin/banners:
    get:
      operationId: listBannerSlots
      summary: List the three fixed Hero slots
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Positions 1, 2, and 3, including empty slots.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    minItems: 3
                    maxItems: 3
                    items:
                      $ref: '#/components/schemas/BannerSlot'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/catalog/admin/banners/{position}:
    parameters:
      - name: position
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 3 }
    get:
      operationId: getBannerSlot
      summary: Read one Hero slot
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The requested slot. Content is null when empty.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BannerSlot'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: saveBannerSlot
      summary: Fill or replace the content of a Hero slot
      description: Send car_id to use a Car variant, including an inactive variant. The existing manual fields remain supported for older clients.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BannerInput'
      responses:
        '200':
          $ref: '#/components/responses/BannerSaved'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: clearBannerSlot
      summary: Clear the slot content and keep its position
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/BannerSaved'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/catalog/home/banners:
    get:
      operationId: listHomeBanners
      summary: List filled Hero slots in position order
      description: A filled slot remains visible when its linked Car becomes inactive.
      responses:
        '200':
          description: Zero to three public Hero banners.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 3
                    items:
                      $ref: '#/components/schemas/PublicBanner'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/catalog/admin/featured-cars:
    get:
      operationId: listAdminFeaturedCars
      summary: Read the ordered Featured Cars selection (OWNER or ADMIN)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Selected cars in display order, including their current status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminFeaturedCars'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: replaceFeaturedCars
      summary: Replace the Featured Cars selection (OWNER or ADMIN)
      description: Array order defines display order. Send an empty array to clear the selection. Inactive cars are retained in the admin selection and excluded from public results.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [car_ids]
              properties:
                car_ids:
                  type: array
                  maxItems: 3
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Saved selection in the submitted order.
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message: { type: string }
                  data:
                    $ref: '#/components/schemas/AdminFeaturedCars'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/catalog/home/featured-cars:
    get:
      operationId: listPublicFeaturedCars
      summary: List selected active cars in display order
      security: []
      responses:
        '200':
          description: Up to three active selections in the saved order. An empty selection returns an empty array.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 3
                    items:
                      $ref: '#/components/schemas/CarCard'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/catalog/admin/cars:
    get:
      operationId: listAdminCars
      summary: List active and inactive cars
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CarSearch'
        - $ref: '#/components/parameters/CarBrand'
        - $ref: '#/components/parameters/CarSeats'
        - $ref: '#/components/parameters/CarMinPrice'
        - $ref: '#/components/parameters/CarMaxPrice'
        - $ref: '#/components/parameters/CarCategory'
        - $ref: '#/components/parameters/CarTransmission'
        - $ref: '#/components/parameters/CarSort'
        - $ref: '#/components/parameters/CarPage'
        - $ref: '#/components/parameters/CarLimit'
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
      responses:
        '200':
          description: Page of cars for the dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCarList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCar
      summary: Create a car with its cover and gallery
      description: |
        Upload the files first. The car and its image references are saved together.
        Gallery images are saved in the order they appear in the request.
        Status defaults to inactive. Send active to publish immediately.
        The server generates the slug from the brand, model, and optional trim.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCarInput'
      responses:
        '201':
          $ref: '#/components/responses/CarSaved'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/catalog/admin/cars/{id}:
    parameters:
      - $ref: '#/components/parameters/CarID'
    get:
      operationId: getAdminCar
      summary: Get the car and its image metadata
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The requested car.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminCarDetail'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateCar
      summary: Edit fields or change car publication status
      description: |
        Omitted fields keep their values. A submitted cover replaces the cover.
        A submitted gallery replaces the gallery, follows request order, and must contain at least one photo.
        Car fields and image references are saved together.
        Use an empty trim to clear it. An active car requires a cover.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCarInput'
      responses:
        '200':
          $ref: '#/components/responses/CarSaved'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/catalog/cars:
    get:
      operationId: listPublicCars
      summary: Browse active cars
      parameters:
        - $ref: '#/components/parameters/CarSearch'
        - $ref: '#/components/parameters/CarBrand'
        - $ref: '#/components/parameters/CarSeats'
        - $ref: '#/components/parameters/CarMinPrice'
        - $ref: '#/components/parameters/CarMaxPrice'
        - $ref: '#/components/parameters/CarCategory'
        - $ref: '#/components/parameters/CarTransmission'
        - $ref: '#/components/parameters/CarSort'
        - $ref: '#/components/parameters/CarPage'
        - $ref: '#/components/parameters/CarLimit'
      responses:
        '200':
          description: Page of published cars.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/catalog/cars/{slug}:
    parameters:
      - $ref: '#/components/parameters/CarSlug'
    get:
      operationId: getPublicCar
      summary: Read the details and photos of a car
      description: |
        Active cars and inactive cars linked to a Hero banner are readable.
        An inactive car cannot be used for checkout. Unknown slugs and
        inactive cars without a linked banner return CAR_NOT_FOUND.
      responses:
        '200':
          description: The requested public car.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CarDetail'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/catalog/cars/{slug}/related:
    parameters:
      - $ref: '#/components/parameters/CarSlug'
    get:
      operationId: listRelatedCars
      summary: List other active cars, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 3, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: Other active cars. The source may be active or linked to a Hero banner.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CarCard'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/catalog/brands:
    get:
      operationId: listPublicCarBrands
      summary: List brand filter options for active cars
      responses:
        '200':
          description: Brands in name order, including any inactive brand still used by an active car.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Identity session token for an OWNER or ADMIN.
  parameters:
    CarID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CarSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    CarSearch:
      name: search
      in: query
      description: Case-insensitive literal substring in the brand name, model, or trim.
      schema: { type: string }
    CarBrand:
      name: brand_id
      in: query
      schema: { type: string, format: uuid }
    CarSeats:
      name: seats
      in: query
      description: Exact seat count.
      schema: { type: integer, minimum: 1 }
    CarMinPrice:
      name: min_price
      in: query
      description: Inclusive minimum daily rate in IDR.
      schema: { type: integer, format: int64, minimum: 0 }
    CarMaxPrice:
      name: max_price
      in: query
      description: Inclusive maximum daily rate in IDR.
      schema: { type: integer, format: int64, minimum: 0 }
    CarCategory:
      name: category
      in: query
      schema: { type: string, enum: [economy, city, mpv, suv, premium] }
    CarTransmission:
      name: transmission
      in: query
      schema: { type: string, enum: [automatic, manual] }
    CarSort:
      name: sort
      in: query
      description: Recommended means newest first, with descending ID as the tiebreaker.
      schema: { type: string, default: recommended, enum: [recommended, price-asc, price-desc, name-asc] }
    CarPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    CarLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    CreateCarInput:
      type: object
      additionalProperties: false
      required: [brand_id, model, category, body_type, seats, transmission, fuel_type, description, daily_rate_idr, cover, gallery]
      properties:
        brand_id: { type: string, format: uuid }
        model: { type: string, minLength: 1, maxLength: 100 }
        trim: { type: string, maxLength: 100 }
        category: { type: string, enum: [economy, city, mpv, suv, premium] }
        body_type: { type: string, enum: [hatchback, sedan, mpv, suv] }
        seats: { type: integer, minimum: 1, maximum: 2147483647 }
        transmission: { type: string, enum: [automatic, manual] }
        fuel_type: { type: string, enum: [petrol, diesel, hybrid, electric] }
        description: { type: string, minLength: 1, maxLength: 2000 }
        daily_rate_idr: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [active, inactive], default: inactive }
        cover:
          $ref: '#/components/schemas/CarPhotoInput'
        gallery:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CarPhotoInput'
    UpdateCarInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        brand_id: { type: string, format: uuid }
        model: { type: string, minLength: 1, maxLength: 100 }
        trim: { type: string, maxLength: 100 }
        category: { type: string, enum: [economy, city, mpv, suv, premium] }
        body_type: { type: string, enum: [hatchback, sedan, mpv, suv] }
        seats: { type: integer, minimum: 1, maximum: 2147483647 }
        transmission: { type: string, enum: [automatic, manual] }
        fuel_type: { type: string, enum: [petrol, diesel, hybrid, electric] }
        description: { type: string, minLength: 1, maxLength: 2000 }
        daily_rate_idr: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [active, inactive] }
        cover:
          $ref: '#/components/schemas/CarPhotoInput'
        gallery:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CarPhotoInput'
    CarPhotoInput:
      type: object
      additionalProperties: false
      required: [object_key, alt_text, label]
      properties:
        object_key: { type: string }
        alt_text: { type: string, minLength: 1, maxLength: 200 }
        label: { type: string, minLength: 1, maxLength: 100 }
    CarImage:
      type: object
      required: [url, alt_text, label]
      properties:
        url: { type: string, format: uri, nullable: true }
        alt_text: { type: string }
        label: { type: string }
    AdminCarImage:
      allOf:
        - $ref: '#/components/schemas/CarImage'
        - type: object
          required: [id, object_key, kind]
          properties:
            id: { type: string, format: uuid }
            object_key: { type: string }
            kind: { type: string, enum: [cover, gallery] }
    CarCard:
      type: object
      required: [id, brand_id, brand_name, model, trim, slug, category, seats, transmission, daily_rate_idr, cover]
      properties:
        id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid }
        brand_name: { type: string }
        model: { type: string }
        trim: { type: string }
        slug: { type: string }
        category: { type: string }
        seats: { type: integer }
        transmission: { type: string }
        daily_rate_idr: { type: integer, format: int64 }
        cover:
          type: object
          nullable: true
          required: [url, alt_text, label]
          properties:
            url: { type: string, format: uri, nullable: true }
            alt_text: { type: string }
            label: { type: string }
    CarDetail:
      allOf:
        - $ref: '#/components/schemas/CarCard'
        - type: object
          required: [status, body_type, fuel_type, description, gallery]
          properties:
            status: { type: string, enum: [active, inactive] }
            body_type: { type: string }
            fuel_type: { type: string }
            description: { type: string }
            gallery:
              type: array
              description: Cover first, followed by gallery images in the order they were saved.
              items:
                $ref: '#/components/schemas/CarImage'
    AdminFeaturedCars:
      type: array
      maxItems: 3
      items:
        allOf:
          - $ref: '#/components/schemas/CarCard'
          - type: object
            required: [status]
            properties:
              status: { type: string, enum: [active, inactive] }
    AdminCarCard:
      allOf:
        - $ref: '#/components/schemas/CarCard'
        - type: object
          required: [status, created_at, updated_at]
          properties:
            status: { type: string, enum: [active, inactive] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    AdminCarDetail:
      allOf:
        - $ref: '#/components/schemas/AdminCarCard'
        - type: object
          required: [body_type, fuel_type, description, images]
          properties:
            body_type: { type: string }
            fuel_type: { type: string }
            description: { type: string }
            images:
              type: array
              description: Cover first, followed by gallery images in the order they were saved.
              items:
                $ref: '#/components/schemas/AdminCarImage'
    CarPage:
      type: object
      required: [number, limit, total]
      properties:
        number: { type: integer }
        limit: { type: integer }
        total: { type: integer, format: int64 }
    CarList:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CarCard'
        page:
          $ref: '#/components/schemas/CarPage'
    AdminCarList:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminCarCard'
        page:
          $ref: '#/components/schemas/CarPage'
    BannerInput:
      oneOf:
        - $ref: '#/components/schemas/LinkedBannerInput'
        - $ref: '#/components/schemas/ManualBannerInput'
    LinkedBannerInput:
      type: object
      additionalProperties: false
      required: [car_id, headline_line_1, headline_line_2, description, image_object_key]
      properties:
        car_id: { type: string, format: uuid }
        headline_line_1: { type: string, minLength: 1, maxLength: 100 }
        headline_line_2: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 500 }
        image_object_key:
          type: string
          description: Existing object key from Catalog image upload.
    ManualBannerInput:
      type: object
      additionalProperties: false
      required: [brand_id, car_model, car_slug, headline_line_1, headline_line_2, description, image_object_key]
      properties:
        brand_id: { type: string, format: uuid }
        car_model: { type: string, minLength: 1, maxLength: 100 }
        car_slug: { type: string, minLength: 1, maxLength: 150, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        headline_line_1: { type: string, minLength: 1, maxLength: 100 }
        headline_line_2: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 500 }
        image_object_key:
          type: string
          description: Existing object key from Catalog image upload.
    BannerSlot:
      type: object
      required: [position, content]
      properties:
        position: { type: integer, minimum: 1, maximum: 3 }
        content:
          type: object
          nullable: true
          required: [car_id, brand_id, brand_name, car_model, car_slug, headline_line_1, headline_line_2, description, image_object_key, image_url]
          properties:
            car_id: { type: string, format: uuid, nullable: true }
            brand_id: { type: string, format: uuid }
            brand_name: { type: string }
            car_model: { type: string }
            car_slug: { type: string }
            headline_line_1: { type: string }
            headline_line_2: { type: string }
            description: { type: string }
            image_object_key: { type: string }
            image_url: { type: string, format: uri, nullable: true }
    PublicBanner:
      type: object
      required: [slug, make, model, image, headline, description]
      properties:
        slug: { type: string }
        make: { type: string }
        model: { type: string }
        image: { type: string, format: uri, nullable: true }
        headline:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string }
        description: { type: string }
    CreateBrandInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Name is trimmed and must contain 1 to 100 characters after trimming. Names are case-insensitively unique.
        image_object_key:
          type: string
          nullable: true
          description: Existing object key from the Catalog image upload endpoint.
        image_filename:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          description: Optional display filename with no path or control characters. Requires a non-null image_object_key.
    UpdateBrandInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          description: Name is trimmed and must contain 1 to 100 characters after trimming. Names are case-insensitively unique.
        image_object_key:
          type: string
          nullable: true
          description: Existing object key from the Catalog image upload endpoint.
        image_filename:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          description: Optional display filename with no path or control characters. Can be set only alongside a non-null image_object_key.
        status: { type: string, enum: [active, inactive] }
    Brand:
      type: object
      required: [id, name, image_object_key, image_filename, image_url, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        image_object_key: { type: string, nullable: true }
        image_filename: { type: string, nullable: true }
        image_url:
          type: string
          format: uri
          nullable: true
          description: Public image URL. Null without an attachment or configured public image base URL.
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string, format: date-time, description: RFC 3339 in UTC. }
        updated_at: { type: string, format: date-time, description: RFC 3339 in UTC. }
  responses:
    CarSaved:
      description: Success message and saved car.
      content:
        application/json:
          schema:
            type: object
            required: [message, data]
            properties:
              message: { type: string }
              data:
                $ref: '#/components/schemas/AdminCarDetail'
    BannerSaved:
      description: Success message and current slot.
      content:
        application/json:
          schema:
            type: object
            required: [message, data]
            properties:
              message: { type: string }
              data:
                $ref: '#/components/schemas/BannerSlot'
    Brand:
      description: Success message and saved brand.
      content:
        application/json:
          schema:
            type: object
            required: [message, data]
            properties:
              message: { type: string }
              data:
                $ref: '#/components/schemas/Brand'
    Error:
      description: |
        400 invalid input or image key, 401 invalid or missing session, 403 role denied,
        404 resource not found, 409 duplicate name, variant, slug, or car cover conflict, 413 body too large,
        415 unsupported media type, 500 unexpected error, or 503 Identity/R2 unavailable.
      content:
        application/json:
          schema:
            type: object
            required: [error, request_id]
            properties:
              error:
                type: object
                required: [code, message, details]
                properties:
                  code: { type: string }
                  message: { type: string }
                  details: { type: object }
              request_id: { type: string }
