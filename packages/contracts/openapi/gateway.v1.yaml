openapi: 3.0.3
info:
  title: SROOM Gateway API
  version: 1.14.0
  description: |
    Local entry point for the documented Identity, Catalog, Booking, and Payment routes.
    Request and response schemas are owned by those services. The gateway forwards
    Bearer tokens and propagates a validated or generated X-Request-ID.
    The staff and customer session routes use separate HttpOnly cookies. Mutating
    requests to those routes require an Origin in the gateway's WEB_ORIGINS allowlist.
    POST /webhooks/midtrans is a provider callback without browser session/origin
    checks, forwarded unchanged to Payment with a 10-second upstream deadline.
    Gateway failures use the same error envelope, with 413 PAYLOAD_TOO_LARGE,
    503 DEPENDENCY_UNAVAILABLE for connection failures, or 504 DEPENDENCY_UNAVAILABLE
    for timeouts. Request bodies are capped at 16 KiB, or 6 MiB for image uploads.
servers:
  - url: http://localhost:8080
security: []
paths:
  /api/v1/customer/bookings/{id}/payment/refresh:
    post:
      operationId: refreshCustomerPaymentAtGateway
      summary: Check an owned payment with the provider
      description: >-
        Requires the customer cookie and an allowed Origin. Payment independently
        verifies Identity/ownership. Forwards {} to Payment with the existing
        15-second deadline. Does not create a new payment or extend the hold.
      security: [{ customerCookie: [] }]
      parameters:
        - $ref: './payment.v1.yaml#/components/parameters/ReadID'
        - name: Origin
          in: header
          required: true
          schema: { type: string }
      requestBody:
        $ref: './payment.v1.yaml#/components/requestBodies/CreateVA'
      responses:
        '200':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payment~1refresh/post/responses/200'
        '400':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payment~1refresh/post/responses/400'
        '401':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payment~1refresh/post/responses/401'
        '403':
          description: FORBIDDEN_ORIGIN or Payment's FORBIDDEN role check.
          content:
            application/json:
              schema: { $ref: './payment.v1.yaml#/components/schemas/Error' }
        '404':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payment~1refresh/post/responses/404'
        '413':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payment~1refresh/post/responses/413'
        '503':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payment~1refresh/post/responses/503'
        '504':
          description: DEPENDENCY_UNAVAILABLE when Payment exceeds the Gateway deadline; retry is safe.
          content:
            application/json:
              schema: { $ref: './payment.v1.yaml#/components/schemas/Error' }
  /api/v1/customer/bookings/{id}/payment:
    get:
      operationId: readCustomerPaymentAtGateway
      summary: Read payment for the signed-in customer
      description: >-
        Uses the corresponding HttpOnly session cookie, forwarded as Bearer to
        Payment. No Origin header is required for GET; provided browser origins must
        be allowed. Payment independently verifies Identity roles and ownership.
        Reads are no-store and do not call Midtrans or change payment/Booking state.
      security: [{ customerCookie: [] }]
      parameters:
        - $ref: './payment.v1.yaml#/components/parameters/ReadID'
      responses:
        '200':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payment/get/responses/200'
        '400':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payment/get/responses/400'
        '401':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payment/get/responses/401'
        '403':
          description: FORBIDDEN for role denial or FORBIDDEN_ORIGIN for a disallowed browser origin.
          content:
            application/json:
              schema: { $ref: './payment.v1.yaml#/components/schemas/Error' }
        '404':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payment/get/responses/404'
        '503':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payment/get/responses/503'
        '504':
          description: DEPENDENCY_UNAVAILABLE when Payment exceeds the Gateway deadline.
          content:
            application/json:
              schema: { $ref: './payment.v1.yaml#/components/schemas/Error' }
  /api/v1/staff/payments:
    get:
      operationId: listStaffPaymentsAtGateway
      summary: List payment attempts for staff
      description: >-
        Uses the corresponding HttpOnly session cookie, forwarded as Bearer to
        Payment. No Origin header is required for GET; provided browser origins must
        be allowed. Payment independently verifies Identity roles and ownership.
        Reads are no-store and do not call Midtrans or change payment/Booking state.
      security: [{ staffCookie: [] }]
      parameters:
        - $ref: './payment.v1.yaml#/components/parameters/Page'
        - $ref: './payment.v1.yaml#/components/parameters/Limit'
        - $ref: './payment.v1.yaml#/components/parameters/Search'
        - $ref: './payment.v1.yaml#/components/parameters/PaymentStatus'
        - $ref: './payment.v1.yaml#/components/parameters/Reconciliation'
      responses:
        '200':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1admin~1payments/get/responses/200'
        '400':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1admin~1payments/get/responses/400'
        '401':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1admin~1payments/get/responses/401'
        '403':
          description: FORBIDDEN for role denial or FORBIDDEN_ORIGIN for a disallowed browser origin.
          content:
            application/json:
              schema: { $ref: './payment.v1.yaml#/components/schemas/Error' }
        '503':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1admin~1payments/get/responses/503'
        '504':
          description: DEPENDENCY_UNAVAILABLE when Payment exceeds the Gateway deadline.
          content:
            application/json:
              schema: { $ref: './payment.v1.yaml#/components/schemas/Error' }
  /api/v1/staff/payments/{id}:
    get:
      operationId: readStaffPaymentAtGateway
      summary: Read payment detail for staff
      description: >-
        Uses the corresponding HttpOnly session cookie, forwarded as Bearer to
        Payment. No Origin header is required for GET; provided browser origins must
        be allowed. Payment independently verifies Identity roles and ownership.
        Reads are no-store and do not call Midtrans or change payment/Booking state.
      security: [{ staffCookie: [] }]
      parameters:
        - $ref: './payment.v1.yaml#/components/parameters/ReadID'
      responses:
        '200':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1admin~1payments~1{id}/get/responses/200'
        '400':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1admin~1payments~1{id}/get/responses/400'
        '401':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1admin~1payments~1{id}/get/responses/401'
        '403':
          description: FORBIDDEN for role denial or FORBIDDEN_ORIGIN for a disallowed browser origin.
          content:
            application/json:
              schema: { $ref: './payment.v1.yaml#/components/schemas/Error' }
        '404':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1admin~1payments~1{id}/get/responses/404'
        '503':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1admin~1payments~1{id}/get/responses/503'
        '504':
          description: DEPENDENCY_UNAVAILABLE when Payment exceeds the Gateway deadline.
          content:
            application/json:
              schema: { $ref: './payment.v1.yaml#/components/schemas/Error' }
  /webhooks/midtrans:
    $ref: './payment.v1.yaml#/paths/~1webhooks~1midtrans'
  /health:
    get:
      operationId: gatewayHealth
      summary: Check whether the gateway process is running
      responses:
        '200':
          description: Gateway process is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /api/v1/identity/register:
    $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1register'
  /api/v1/identity/login:
    $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1login'
  /api/v1/identity/me:
    $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1me'
  /api/v1/identity/logout:
    $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1logout'
  /api/v1/identity/change-password:
    $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1change-password'
  /api/v1/identity/admins:
    $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1admins'
  /api/v1/identity/admins/{id}:
    $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1admins~1{id}'
  /api/v1/identity/customers:
    $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1customers'
  /api/v1/identity/customers/{id}:
    $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1customers~1{id}'
  /api/v1/identity/customers/{id}/status:
    $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1customers~1{id}~1status'
  /api/v1/catalog/admin/images:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1admin~1images'
  /api/v1/catalog/admin/brands:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1admin~1brands'
  /api/v1/catalog/admin/brands/{id}:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1admin~1brands~1{id}'
  /api/v1/catalog/admin/banners:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1admin~1banners'
  /api/v1/catalog/admin/banners/{position}:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1admin~1banners~1{position}'
  /api/v1/catalog/home/banners:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1home~1banners'
  /api/v1/catalog/admin/featured-cars:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1admin~1featured-cars'
  /api/v1/catalog/home/featured-cars:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1home~1featured-cars'
  /api/v1/catalog/admin/cars:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1admin~1cars'
  /api/v1/catalog/admin/cars/{id}:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1admin~1cars~1{id}'
  /api/v1/catalog/admin/cars/{id}/units:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1admin~1cars~1{id}~1units'
  /api/v1/catalog/admin/units/{id}:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1admin~1units~1{id}'
  /api/v1/catalog/cars:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1cars'
  /api/v1/catalog/cars/{slug}:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1cars~1{slug}'
  /api/v1/catalog/cars/{slug}/related:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1cars~1{slug}~1related'
  /api/v1/catalog/brands:
    $ref: './catalog.v1.yaml#/paths/~1api~1v1~1catalog~1brands'
  /api/v1/customer/login:
    post:
      operationId: customerLogin
      summary: Start a CUSTOMER browser session
      requestBody:
        $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1login/post/requestBody'
      responses:
        '200':
          description: Customer profile and session cookie. The response body contains the profile only.
          headers:
            Set-Cookie:
              description: Host-only sroom_customer_session with HttpOnly, SameSite=Lax, Path=/api/v1/customer, and expiration from Identity. Secure outside development.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: './identity.v1.yaml#/components/schemas/UserProfile'
        '401':
          $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1login/post/responses/401'
        '403':
          description: CUSTOMER_REQUIRED for another role or FORBIDDEN_ORIGIN for an untrusted origin.
          content:
            application/json:
              schema:
                $ref: './identity.v1.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './identity.v1.yaml#/components/responses/RateLimited'
        default:
          $ref: './identity.v1.yaml#/components/responses/OtherError'
  /api/v1/customer/bookings:
    get:
      operationId: listCustomerBookings
      summary: List the signed-in customer's bookings
      security:
        - customerCookie: []
      parameters:
        - $ref: './booking.v1.yaml#/components/parameters/BookingPage'
        - $ref: './booking.v1.yaml#/components/parameters/BookingLimit'
        - $ref: './booking.v1.yaml#/components/parameters/BookingStatus'
      responses:
        '200':
          $ref: './booking.v1.yaml#/components/responses/CustomerBookings'
        '400':
          $ref: './booking.v1.yaml#/components/responses/ReadBadRequest'
        '401':
          $ref: './booking.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './booking.v1.yaml#/components/responses/CustomerRequired'
        '503':
          $ref: './booking.v1.yaml#/components/responses/BookingReadUnavailable'
    post:
      operationId: createCustomerDemoHold
      summary: Create a customer demo reservation
      description: Use an allowed Origin and the customer session cookie. Booking verifies the customer role.
      security:
        - customerCookie: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema: { type: string }
        - $ref: './booking.v1.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: './booking.v1.yaml#/components/requestBodies/HoldRequest'
      responses:
        '201':
          $ref: './booking.v1.yaml#/components/responses/Hold'
        '400':
          $ref: './booking.v1.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './booking.v1.yaml#/components/responses/Unauthenticated'
        '403':
          description: CUSTOMER_REQUIRED for another role or FORBIDDEN_ORIGIN for an untrusted origin.
          content:
            application/json:
              schema:
                $ref: './booking.v1.yaml#/components/schemas/Error'
        '404':
          $ref: './booking.v1.yaml#/components/responses/VariantNotFound'
        '409':
          $ref: './booking.v1.yaml#/components/responses/HoldConflict'
        '413':
          $ref: './booking.v1.yaml#/components/responses/PayloadTooLarge'
        '422':
          $ref: './booking.v1.yaml#/components/responses/InvalidHold'
        '503':
          $ref: './booking.v1.yaml#/components/responses/HoldUnavailable'
        '504':
          description: DEPENDENCY_UNAVAILABLE when Gateway times out waiting for Booking.
          content:
            application/json:
              schema:
                $ref: './booking.v1.yaml#/components/schemas/Error'
  /api/v1/customer/bookings/{id}/payments/va:
    post:
      operationId: createCustomerBNIVA
      summary: Create or retrieve a BNI virtual account for an owned booking
      description: >-
        Requires an allowed Origin and the customer session cookie. Payment verifies
        the session and ownership. Forwarding is bounded to 15 seconds. The direct
        Payment route and private service APIs are not exposed through Gateway.
      security:
        - customerCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: Origin
          in: header
          required: true
          schema: { type: string }
      requestBody:
        $ref: './payment.v1.yaml#/components/requestBodies/CreateVA'
      responses:
        '200':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payments~1va/post/responses/200'
        '201':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payments~1va/post/responses/201'
        '202':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payments~1va/post/responses/202'
        '400':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payments~1va/post/responses/400'
        '401':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payments~1va/post/responses/401'
        '403':
          description: FORBIDDEN_ORIGIN or Payment's FORBIDDEN role check.
          content:
            application/json:
              schema: { $ref: './payment.v1.yaml#/components/schemas/Error' }
        '404':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payments~1va/post/responses/404'
        '409':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payments~1va/post/responses/409'
        '413':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payments~1va/post/responses/413'
        '503':
          $ref: './payment.v1.yaml#/paths/~1api~1v1~1payment~1bookings~1{id}~1payments~1va/post/responses/503'
        '504':
          description: DEPENDENCY_UNAVAILABLE when Payment exceeds the Gateway deadline. Retry the same booking and key.
          content:
            application/json:
              schema: { $ref: './payment.v1.yaml#/components/schemas/Error' }
  /api/v1/customer/bookings/{id}:
    parameters:
      - $ref: './booking.v1.yaml#/components/parameters/BookingID'
    get:
      operationId: getCustomerBooking
      summary: Read the signed-in customer's booking
      security:
        - customerCookie: []
      responses:
        '200':
          $ref: './booking.v1.yaml#/components/responses/CustomerBooking'
        '400':
          $ref: './booking.v1.yaml#/components/responses/ReadBadRequest'
        '401':
          $ref: './booking.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './booking.v1.yaml#/components/responses/CustomerRequired'
        '404':
          $ref: './booking.v1.yaml#/components/responses/BookingNotFound'
        '503':
          $ref: './booking.v1.yaml#/components/responses/BookingReadUnavailable'
  /api/v1/customer/checkout/quotes:
    post:
      operationId: createCustomerCheckoutQuote
      summary: Check availability and price for a customer schedule
      description: Requires a customer session cookie and an Origin in WEB_ORIGINS. Booking verifies the customer role with Identity.
      security:
        - customerCookie: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema: { type: string }
      requestBody:
        $ref: './booking.v1.yaml#/components/requestBodies/QuoteRequest'
      responses:
        '200':
          $ref: './booking.v1.yaml#/components/responses/Quote'
        '400':
          $ref: './booking.v1.yaml#/components/responses/InvalidRequest'
        '401':
          $ref: './booking.v1.yaml#/components/responses/Unauthenticated'
        '403':
          description: CUSTOMER_REQUIRED for another role or FORBIDDEN_ORIGIN for an untrusted origin.
          content:
            application/json:
              schema:
                $ref: './booking.v1.yaml#/components/schemas/Error'
        '404':
          $ref: './booking.v1.yaml#/components/responses/VariantNotFound'
        '413':
          $ref: './booking.v1.yaml#/components/responses/PayloadTooLarge'
        '422':
          $ref: './booking.v1.yaml#/components/responses/InvalidQuote'
        '503':
          $ref: './booking.v1.yaml#/components/responses/DependencyUnavailable'
        '504':
          description: DEPENDENCY_UNAVAILABLE when Gateway times out waiting for Booking.
          content:
            application/json:
              schema:
                $ref: './booking.v1.yaml#/components/schemas/Error'
  /api/v1/customer/me:
    get:
      operationId: getCustomerProfile
      summary: Read the current CUSTOMER profile
      security:
        - customerCookie: []
      responses:
        '200':
          $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1me/get/responses/200'
        '401':
          $ref: './identity.v1.yaml#/components/responses/Unauthenticated'
        default:
          $ref: './identity.v1.yaml#/components/responses/OtherError'
  /api/v1/customer/logout:
    post:
      operationId: customerLogout
      summary: End the CUSTOMER browser session
      security:
        - customerCookie: []
        - {}
      responses:
        '204':
          description: Session revoked if valid. The customer cookie is expired even when the session was missing or expired.
          headers:
            Set-Cookie:
              description: Expires sroom_customer_session.
              schema: { type: string }
        default:
          $ref: './identity.v1.yaml#/components/responses/OtherError'
  /api/v1/customer/change-password:
    post:
      operationId: customerChangePassword
      summary: Change the signed-in CUSTOMER password
      description: Requires an allowed Origin and the customer session cookie. Identity verifies the role and current password. Existing sessions remain valid.
      security:
        - customerCookie: []
      requestBody:
        $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1customer~1change-password/post/requestBody'
      responses:
        '204':
          $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1customer~1change-password/post/responses/204'
        '400':
          $ref: './identity.v1.yaml#/paths/~1api~1v1~1identity~1customer~1change-password/post/responses/400'
        '401':
          $ref: './identity.v1.yaml#/components/responses/Unauthenticated'
        '403':
          description: FORBIDDEN or FORBIDDEN_ORIGIN.
        '415':
          $ref: './identity.v1.yaml#/components/responses/UnsupportedMediaType'
        default:
          $ref: './identity.v1.yaml#/components/responses/OtherError'
  /api/v1/staff/bookings:
    get:
      operationId: listStaffBookings
      summary: List bookings as ADMIN or OWNER
      security:
        - staffCookie: []
      parameters:
        - $ref: './booking.v1.yaml#/components/parameters/BookingPage'
        - $ref: './booking.v1.yaml#/components/parameters/BookingLimit'
        - $ref: './booking.v1.yaml#/components/parameters/BookingStatus'
        - $ref: './booking.v1.yaml#/components/parameters/BookingVariant'
        - $ref: './booking.v1.yaml#/components/parameters/BookingPickupDate'
        - $ref: './booking.v1.yaml#/components/parameters/BookingSearch'
      responses:
        '200':
          $ref: './booking.v1.yaml#/components/responses/StaffBookings'
        '400':
          $ref: './booking.v1.yaml#/components/responses/ReadBadRequest'
        '401':
          $ref: './booking.v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './booking.v1.yaml#/components/responses/StaffRequired'
        '503':
          $ref: './booking.v1.yaml#/components/responses/BookingReadUnavailable'
  /api/v1/staff/bookings/{id}:
    parameters:
      - $ref: './booking.v1.yaml#/components/parameters/BookingID'
    get:
      operationId: getStaffBooking
